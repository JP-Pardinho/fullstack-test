<header class="border-b border-slate-200 bg-white">
  <nav class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3 sm:px-6">
    <a routerLink="/investimentos" class="flex items-center gap-2 text-lg font-bold tracking-tight text-slate-900">
      <span>Sistema de Investimentos</span>
    </a>

    <div class="flex items-center gap-2 sm:gap-4">
      <a
        routerLink="/investimentos"
        routerLinkActive="bg-slate-100 text-slate-900"
        [routerLinkActiveOptions]="{ exact: true }"
        class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-900"
      >
        Investimentos
      </a>

      <a
        routerLink="/usuarios"
        routerLinkActive="bg-slate-100 text-slate-900"
        class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-900"
      >
        Usuários
      </a>
    </div>
  </nav>
</header>
