<section class="mx-auto max-w-xl space-y-6">
  <div>
    <h1 class="text-2xl font-bold tracking-tight text-slate-900">Novo Usuário</h1>
  </div>

  @if (erro()) {
    <div class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
      {{ erro() }}
    </div>
  }

  <form
    (ngSubmit)="salvar()"
    class="space-y-5 rounded-xl border border-slate-200 bg-white p-6 shadow-sm"
  >
    <div>
      <label for="nome" class="block text-sm font-medium text-slate-700">Nome completo</label>
      <input
        id="nome"
        type="text"
        name="nome"
        [(ngModel)]="nome"
        maxlength="150"
        placeholder="Ex.: Maria Santos"
        class="mt-1.5 w-full rounded-lg border border-slate-300 px-3.5 py-2 text-sm text-slate-900 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20"
      />
    </div>

    <div class="flex items-center justify-end gap-3 pt-2">
      <a
        routerLink="/usuarios"
        class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-50"
      >
        Cancelar
      </a>

      <button
        type="submit"
        [disabled]="enviando()"
        class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white shadow-sm transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-50"
      >
        {{ enviando() ? 'Salvando...' : 'Salvar' }}
      </button>
    </div>
  </form>
</section>
